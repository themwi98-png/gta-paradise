# GTA Paradise settings (paradise.asi). Re-read every few seconds while you
# play: edit, save, and changes apply without a restart (except @car_grip,
# @car_brakes and @tyres_clip).
# Each setting's normal value is shown as [default ...].

#   @mode paradise|los_santos  which map is installed: Paradise City, or
#                          GTA's own Los Santos with only the Burnout driving.
#                          Set by the setup's Map choice: to switch, run the
#                          setup again and pick the other map
#                                                               [default paradise]
#   @start x y z           where you're placed when Paradise City loads
#   @start_car model       the car you start in (a GTA vehicle model name;
#                          none = on foot)                      [default drifttampa]
@mode paradise
@start 994.9 862.7 25.2
@start_car drifttampa

# --- Around Paradise City --------------------------------------------------
#   @shops on|off          Burnout's drive-thrus, with map blips: auto
#                          repairs fix your car, gas stations fill the
#                          boost, paint shops respray it at random,
#                          junkyards stop you and open a menu to
#                          customise the car or swap it for another
#                          (free; not while wanted)
#                                                               [default on]
#   @gta_missions on|off   keep GTA's story missions, side activities,
#                          random events and their map blips. off = all
#                          stopped and hidden (their places are in the
#                          removed Los Santos). Paradise City only; back
#                          on takes a reload of your save       [default off]
#   @switch on|off         GTA's character switch lands in Paradise City:
#                          the character switched to is already driving
#                          their own car on a road somewhere else in the
#                          city (GTA's own scenes for them were in the
#                          removed Los Santos). off = GTA's switch as it
#                          is, which gets stuck here            [default on]
@shops on
@gta_missions off
@switch on

# --- Burnout-style crashes -------------------------------------------------
#   @wreck on|off          hard crashes wreck the car and respawn you nearby
#                                                               [default on]
#   @wreck_speed m/s       sudden speed loss that wrecks (25 = 90 km/h)
#                                                               [default 25]
#   @impact_speed m/s      sudden speed loss that adds extra dents / smashes
#                                                               [default 11]
#   @wreck_explode on|off  blow the car up on a wreck           [default on]
#   @wreck_eject on|off    in a wreck you can fly through the windscreen
#                          (GTA's own, unhurt; you respawn in the new car).
#                          Never when it isn't a wreck. off = stay in
#                                                               [default on]
#   @respawn_speed m/s     speed the fresh car starts at (0 = standing)
#                                                               [default 12]
#   @crash_time s          slow-motion time before the respawn  [default 5]
#   @slowmo x              game speed during the slow motion (1 = normal)
#                                                               [default 0.15]
#   @crash_cam on|off      show crashes from an orbiting crash camera
#                                                               [default on]
@wreck on
@wreck_speed 25
@impact_speed 11
@wreck_explode on
@wreck_eject on
@respawn_speed 12
@crash_time 5
@slowmo 0.15
@crash_cam on
#   @precrash on|off       start the slow-mo crash camera just before a wreck
#                          that is certain to happen            [default on]
#   @precrash_lead s       how far ahead (game seconds) a wreck is seen coming
#                                                               [default 0.12]
@precrash on
@precrash_lead 0.12
#   @crash_cam_speed m/s   any hit at least this hard (sudden speed loss)
#                          shows the slow-mo crash camera from the impact;
#                          if it isn't a wreck you get DRIVEAWAY (14 = 50 km/h)
#                                                               [default 20]
#   @crash_cam_hold s      how long that camera stays when it isn't a wreck
#                                                               [default 1.5]
@crash_cam_speed 20
@crash_cam_hold 1.5
#   @wreck_damage on|off   also wreck a car that is on fire, has a dead engine,
#                          or is jammed (wheels down, gas held, not moving);
#                          upside down never counts (steer to roll back over)
#                                                               [default on]
#   @wreck_stuck s         seconds a jammed car gets first      [default 2.5]
#   @wreck_wheel cm        Burnout rule: only looks may be smashed up. A wheel
#                          knocked this far out of line (bent axle, wheel
#                          pushed in or torn off: the car pulls or won't
#                          steer) wrecks the car (0 = off)      [default 0]
#   @wreck_engine x        engine health under this wrecks the car (1000 =
#                          new; GTA's engines smoke and lose power under
#                          about 400; 0 = only a dead engine)   [default 100]
#   @strong_axles on|off   your axles don't bend from knocks; only a crash
#                          that crushes the body in around a wheel moves it
#                                                               [default on]
#   @strong_tyres on|off   your tyres can't burst               [default on]
#   @prop_keep x           speed kept when knocking over a lamp post, bin,
#                          sign... (1 = no slowdown); such hits cost no health
#                                                               [default 1]
#   @prop_straight on|off  a prop hit can't spin your car: for a
#                          moment it keeps turning the way it was
#                          (going straight stays straight, a drift
#                          carries on)                          [default on]
@wreck_damage on
@wreck_stuck 2.5
@wreck_wheel 0
@wreck_engine 100
@strong_axles on
@strong_tyres on
@prop_keep 1
@prop_straight on
#   @wreck_crush n         strength of each crumple round on a wreck
#                                                               [default 8000]
#   @wreck_crush_rounds n  crumple rounds (more = more mangled) [default 8]
@wreck_crush 8000
@wreck_crush_rounds 8
#   @wreck_clear m         NPCs, vehicles and fires this close to a wreck are
#                          removed before the respawn (0 = off) [default 6]
@wreck_clear 6
#   @wreck_desat x         how much colour drains out during a wreck
#                          (0 = none, 1 = black and white)      [default 0.6]
@wreck_desat 0.6

# --- Police chasing you ----------------------------------------------------
#   @police_power x        engine power, times GTA's            [default 1]
#   @police_top percent    extra top speed                      [default 100]
#   @police_tough on|off   police cars can't be damaged until
#                          your car hits them, and survive
#                          their own crashes at those speeds
#                          (no fires, engines keep running,
#                          drivers aren't killed or thrown out) [default on]
#   @police_grip x         police cars go where they point, physics or not:
#                          share of their sideways slide taken away each
#                          frame (0 = GTA's physics, 1 = no sliding at all);
#                          they can't spin, and flipped ones are put back
#                          on their wheels                      [default 1]
#   @police_sight m        while a police car is this close they know where
#                          you are, seen or not; get further away to lose
#                          them (0 = only what they see)        [default 400]
#   @police_accel g        extra pull when they speed up, all of it while
#                          catching up with you (0 = none)      [default 1]
#   @police_brakes x       braking, times GTA's (1 = GTA's)     [default 3]
#   @police_ram m/s        police cars near you go for your car
#                          to take you down (a PIT from behind,
#                          a slam from alongside), this much
#                          faster than you (0 = they don't)     [default 12]
#   @police_ram_oncoming on|off
#                          police cars coming the other way
#                          steer into you for a head-on (one at
#                          a time)                              [default on]
#   @police_rammers n      how many police cars may go for you
#                          at once                              [default 4]
@police_power 1
@police_top 100
@police_tough on
@police_grip 1
@police_sight 400
@police_accel 1
@police_brakes 3
@police_ram 12
@police_ram_oncoming on
@police_rammers 4

# --- Takedowns: ram police cars into a crash -------------------------------
#   @takedowns on|off      Burnout takedowns on police cars     [default on]
#   @takedown_window s     how long a police car you hit stays
#                          vulnerable: if it crashes in that
#                          time it's your takedown; the same
#                          goes for you after a police car's
#                          hit (TAKEN DOWN)                     [default 2]
#   @takedown_speed m/s    sudden speed change that counts as
#                          its crash                            [default 10]
#   @takedown_boost x      share of the boost gauge a takedown
#                          gives                                [default 0.5]
#   @takedown_smash m/s    a hit at least this hard (closing
#                          speed) takes a police car down at
#                          once, even a parked one (0 = never)  [default 20]
#   @takedown_any on|off   any vehicle can be taken down, not
#                          only police (only police can take
#                          you down)                            [default on]
#   @takedown_explode on|off
#                          taken-down cars blow up              [default on]
#   @takedown_launch m/s   a taken-down car is thrown off your
#                          path at this speed, clear of you
#                          when it blows up (0 = not)           [default 14]
#   @chase_takedowns n     this many police takedowns in one
#                          chase end it: YOU ESCAPED!, wanted
#                          level gone (0 = never)               [default 5]
#   @takedown_keep x       share of its speed your car keeps
#                          when it rams a car                   [default 0.9]
#   @takedown_straight on|off  while ramming, your car can't be
#                          spun: it stays pointed and moving the
#                          way it was going (steering still
#                          turns it)                            [default on]
#   @taken_down_boost x    share of the boost gauge lost when
#                          taken down                           [default 0.25]
@takedowns on
@takedown_window 2
@takedown_speed 10
@takedown_boost 0.5
@takedown_smash 20
@takedown_any on
@takedown_explode on
@takedown_launch 14
@chase_takedowns 5
@takedown_keep 0.9
@takedown_straight on
@taken_down_boost 0.25

# --- Grinding along walls and cars ------------------------------------------
#   @grind on|off          scraping along a wall, barrier or car at
#                          speed barely slows or damages your car,
#                          and throws sparks; a hit while grinding is
#                          never a crash                        [default on]
#   @grind_speed m/s       slowest speed that grinds            [default 12]
#   @grind_drag x          share of its speed your car loses each
#                          second of grinding (0 = none)        [default 0.05]
#   @grind_damage x        share of the damage it still takes   [default 0.1]
#   @grind_sparks x        size of the sparks (0 = none)        [default 1]
@grind on
@grind_speed 12
@grind_drag 0.05
@grind_damage 0.1
@grind_sparks 1

# --- Traffic ---------------------------------------------------------------
#   @traffic x             amount of traffic on the roads, times normal
#                          (0 = empty roads, up to 3). Where it drives
#                          follows Burnout: busy downtown, quiet country
#                          roads; change that per road in the editor
#                                                               [default 1]
#   @junctions on|off      traffic obeys Burnout's traffic
#                          lights, gives way at junctions
#                          without lights, and cars stuck in a
#                          junction out of sight are removed    [default on]
#   @light_time x          how long each light stays green /
#                          red, times Burnout's (10 s green)    [default 1]
#   @light_lamps on|off    light up the lamps of the overhead
#                          traffic lights that have no GTA
#                          model                                [default on]
#   @give_way on|off       at junctions without lights, cars
#                          wait while a car crosses their path  [default on]
#   @unjam s               a car stuck this long in a junction,
#                          out of your sight, is removed
#                          (0 = never)                          [default 10]
#   @light_hold halt|cap   how cars are stopped at a red light:
#                          halt = brake to a stop, cap = top
#                          speed cut to nothing                 [default halt]
@traffic 1
@junctions on
@light_time 1
@light_lamps on
@give_way on
@unjam 10
@light_hold halt

# --- Every car -------------------------------------------------------------
#   @car_top_speed x       top speed, times GTA's (1 = GTA's)   [default 1.35]
#   @car_power x           engine power (acceleration), times GTA's
#                                                               [default 1.35]
#   @car_grip x            grip (cornering and sliding), times GTA's. Built
#                          into the car data: after changing it, run
#                          paradise-setup.exe again (it only redoes the car
#                          handling, a few minutes)             [default 1.2]
#   @car_brakes x          braking power, times GTA's. Built into the car
#                          data like @car_grip                  [default 2.5]
#   @tyres_clip on|off     tyres may sink into kerbs and bumps instead of
#                          the whole car being lifted over them (GTA's
#                          HF_TYRES_CAN_CLIP handling flag, for every
#                          vehicle; off = only the few GTA gives it). Built
#                          into the car data like @car_grip     [default on]
#   @air_gravity x         gravity on cars in the air (1 = GTA's)
#                                                               [default 3]
#   @air_control x         Burnout-style steady flight: in the air your car
#                          doesn't pitch or spin about, it keeps its nose
#                          the way it flies and its wheels down
#                          (0 = off, 1 = held steady)           [default 0.7]
#   @barrel_roll on|off    leaving a split ramp rolling, the car turns
#                          exactly once in the air and lands on its wheels
#                                                               [default on]
#   @barrel_roll_trigger deg/s  how hard a ramp must roll the car (its
#                          average roll early in the jump) for a barrel
#                          roll: higher = fewer rolls           [default 90]
#   @downforce g           extra grip from downforce at ~180 km/h, growing
#                          with speed (0 = none, 2 = glued down) [default 0.75]
#   @drift_assist x        Burnout-style drift help: holds a slide at a
#                          sensible angle and softens the catch so it
#                          doesn't flick into a spin (0 = off, 1 = strong,
#                          up to 3)
#                                                               [default 1.1]
#   @drift_angle deg       the largest drift angle it lets a slide reach
#                                                               [default 45]
#   @brake_drift on|off    tapping the brake at speed works as the handbrake
#                          for a moment, to start a drift (Burnout style);
#                          held longer, it's the normal brake. With the
#                          handbrake held, the brake is always the brake;
#                          the handbrake button during the drift switches
#                          to the normal brake
#                                                               [default on]
#   @brake_drift_time s    how long a press is the handbrake    [default 0.5]
#   @brake_drift_speed m/s from this speed (2.2 = 8 km/h)       [default 2.2]
#   @brake_drift_steer x   only while steering at least this much (0 to 1),
#                          or already turning: braking going straight is
#                          just the brake (0 = straight too)    [default 0.3]
# Police chasing you have their own speed and power (above).
@car_top_speed 1.35
@car_power 1.35
@car_grip 1.2
@car_brakes 2.5
@tyres_clip on
@air_gravity 3
@air_control 0.7
@barrel_roll on
@barrel_roll_trigger 90
@downforce 0.75
@drift_assist 1.1
@drift_angle 45
@brake_drift on
@brake_drift_time 0.5
@brake_drift_speed 2.2
@brake_drift_steer 0.3

# --- Boost: hold A (controller) / X (keyboard) while driving ---------------
#   @boost on|off                                               [default on]
#   @boost_accel m/s2      extra acceleration while boosting    [default 9]
#   @boost_top x           boosted top speed = car's top speed x this...
#                                                               [default 1.8]
#   @boost_min_top m/s     ...at least this (47 = 105 mph)...   [default 47]
#   @boost_max_top m/s     ...at most this (95 = 212 mph)       [default 135]
#   @boost_seconds s       how long a full gauge lasts          [default 15]
#   @boost_fill x          how fast the gauge refills (2 = twice as fast)
#                                                               [default 1.5]
@boost on
@boost_accel 9
@boost_top 1.8
@boost_min_top 47
@boost_max_top 135
@boost_seconds 15
@boost_fill 1.5

# --- Teleports: name x y z (GTA world). F6 cycles through them. ------------
paradise_road 994.9 862.7 25.2
paradise_bigsurf 5069.3 1139.4 38.8
paradise_downtown_west -934.0 -344.6 73.1
paradise_mountains -2288.9 -365.7 112.8

# --- Diagnostics -----------------------------------------------------------
#   @perf on|off           the plugin's cost per frame, written to
#                          paradise.log every 15 s              [default on]
#   @debug_log on|off      old position probe / driving trace (debugging)
#                                                               [default off]
@perf on
@debug_log off
