# gta-paradise settings for paradise.asi
#   @mode paradise|off   off = leave normal GTA untouched (Paradise not applied)
#   @start x y z         where the player is placed when Paradise City is applied
@mode paradise
@start 994.9 862.7 25.2

# Burnout-style crashes (re-read every few seconds, no restart needed).
#   @wreck on|off        hard crashes wreck the car and respawn you nearby
#   @wreck_speed m/s     sudden speed loss that wrecks (18 m/s = 65 km/h)
#   @impact_speed m/s    sudden speed loss that adds extra dents / smashes
#   @wreck_explode on|off  blow the car up on a wreck
#   @respawn_speed m/s   speed the fresh car starts at (0 = standing)
#   @crash_time s        slow-motion crash time before the respawn
#   @slowmo x            game speed during a crash (1 = normal, 0.3 = slow)
#   @crash_cam on|off    show the crash from an orbiting crash camera
@wreck on
@wreck_speed 18
@impact_speed 11
@wreck_explode on
@respawn_speed 12
@crash_time 5
@slowmo 0.15
@crash_cam on
#   @precrash on|off       start the slow-mo crash camera just before a wreck
#   @precrash_lead s       how far ahead (game seconds) a wreck is seen coming
@precrash on
@precrash_lead 0.12
#   @wreck_damage on|off   also wreck a car that is on fire, has a dead engine,
#                          is stuck on its roof or jammed (gas held, not moving)
#   @wreck_stuck s         seconds a jammed / upside-down car gets first
#   @prop_keep x           speed kept when knocking over a lamp post, bin, sign...
#                          (1 = no slowdown); such hits also cost no health
@wreck_damage on
@wreck_stuck 2.5
@prop_keep 0.9
#   @wreck_crush n         strength of each crumple round on a wreck
#   @wreck_crush_rounds n  crumple rounds (more = more mangled)
@wreck_crush 8000
@wreck_crush_rounds 8
#   @wreck_clear m         NPCs, vehicles and fires this close to a wreck are
#                          removed before the respawn (0 = off)
@wreck_clear 6

# Police in pursuit: engine power multiplier and extra top speed (percent).
@police_power 2
@police_top 50

# Gravity on cars in the air, times normal (1 = GTA, 2 = twice as heavy).
@air_gravity 2

# Downforce on fast cars on the ground: extra g at ~180 km/h, growing with
# speed squared (0 = none, 1 = default, 2 = glued down).
@downforce 1

# Boost: hold A (controller) / X (keyboard) while driving.
#   @boost on|off
#   @boost_accel m/s2    extra acceleration while boosting
#   @boost_top x         boosted top speed = car's top speed x this...
#   @boost_min_top m/s   ...at least this (47 m/s = 105 mph)...
#   @boost_max_top m/s   ...at most this (95 m/s = 212 mph)
#   @boost_seconds s     how long a full gauge lasts
#   @boost_fill x        how fast the gauge refills (2 = twice as fast)
@boost on
@boost_accel 9
@boost_top 1.8
@boost_min_top 47
@boost_max_top 95
@boost_seconds 7
@boost_fill 1.5

# Teleport destinations: name x y z (GTA world). F6 cycles through them in
# order; this file is re-read on every press.
paradise_road 994.9 862.7 25.2
paradise_bigsurf 5069.3 1139.4 38.8
paradise_downtown_west -934.0 -344.6 73.1
paradise_mountains -2288.9 -365.7 112.8

# Diagnostics: the plugin's cost per frame, written to paradise.log every
# 15 s; and the old position probe / driving trace (debugging only).
@perf on
@debug_log off
