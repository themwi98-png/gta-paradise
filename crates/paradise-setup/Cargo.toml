[package]
name = "paradise-setup"
version = "0.2.1"
edition.workspace = true
license.workspace = true
description = "Installer for GTA Paradise: builds the mod from the player's own copies of both games and installs it into GTA V Legacy"

[[bin]]
name = "paradise-setup"
path = "src/main.rs"

[[bin]]
name = "paradise-setup-cli"
path = "src/bin/paradise-setup-cli.rs"

[dependencies]
anyhow.workspace = true
serde_json = "1.0.152"
eframe = "0.36"
rfd = "0.17"
